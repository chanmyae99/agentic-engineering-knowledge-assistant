services:
  database:
    image: pgvector/pgvector:pg16
    container_name: knowledge-assistant-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-service/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - knowledge-network

volumes:
  postgres_data:
    name: knowledge-assistant-postgres-data

networks:
  knowledge-network:
    name: knowledge-assistant-network