apiVersion: v1
kind: Secret
metadata:
  name: knowledge-assistant-secrets

type: Opaque

stringData:
  POSTGRES_PASSWORD: "replace_with_database_password"
  OPENAI_API_KEY: "replace_with_openai_api_key"
  SERPER_API_KEY: "replace_with_serper_api_key"
  AZURE_STORAGE_CONNECTION_STRING: "replace_with_azure_storage_connection_string"
  DATABASE_URL: "postgresql+psycopg://knowledge_admin:replace_with_database_password@database-service:5432/knowledge_assistant"