apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: database

  template:
    metadata:
      labels:
        app: database

    spec:
      containers:
        - name: database
          image: chanmyae99/knowledge-assistant-database:1.0

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: knowledge-assistant-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: knowledge-assistant-config
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knowledge-assistant-secrets
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: database-pvc